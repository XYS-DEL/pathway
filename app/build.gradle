plugins {
    id "com.android.application"
    // 谷歌官方推荐的用于隐藏地图 KEY 的插件 https://developers.google.com/maps/documentation/places/android-sdk/secrets-gradle-plugin?hl=zh-cn
    id "com.google.android.libraries.mapsplatform.secrets-gradle-plugin"
}

// secrets 插件默认会把 local.properties 里的所有键都生成为 BuildConfig 常量。
// 签名凭据只供 Gradle 构建期使用，绝不能进 BuildConfig：debug 包不做混淆，
// 密码会以明文留在 APK 里（release 包只是侥幸被 R8 剥离，不应依赖这一点）。
// 注意：下面的签名配置是直接读 local.properties 的，与本插件无关，屏蔽后不受影响。
secrets {
    ignoreList.add("RELEASE_.*")
}

// 签名凭据从 local.properties 读取（该文件已被 .gitignore 忽略），
// 避免把 keystore 与密码提交进版本库
def signingProps = new Properties()
def signingPropsFile = rootProject.file('local.properties')
if (signingPropsFile.exists()) {
    signingPropsFile.withInputStream { signingProps.load(it) }
}
def hasReleaseSigning = signingProps.getProperty('RELEASE_STORE_FILE') != null
        && rootProject.file(signingProps.getProperty('RELEASE_STORE_FILE')).exists()

android {
    ndkVersion = '26.2.11394342'
    compileSdk = 32
    buildToolsVersion = '36.0.0'
    namespace = 'com.iterlocus.pathway'

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(signingProps.getProperty('RELEASE_STORE_FILE'))
                storePassword signingProps.getProperty('RELEASE_STORE_PASSWORD')
                keyAlias signingProps.getProperty('RELEASE_KEY_ALIAS')
                keyPassword signingProps.getProperty('RELEASE_KEY_PASSWORD')
            }
        }
    }

    defaultConfig {
        applicationId "com.iterlocus.pathway"
        minSdkVersion 27
        //noinspection ExpiredTargetSdkVersion
        targetSdkVersion 32
        versionCode 1
        versionName '1.0.0' // https://semver.org/lang/zh-CN/
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        resourceConfigurations += ['zh', 'zh-rCN', 'en', 'en-rUS']
        ndk {
            //noinspection ChromeOsAbiSupport
            abiFilters "arm64-v8a"
        }
        if (hasReleaseSigning) {
            signingConfig = signingConfigs.release
        }
    }

    buildTypes {
        release {
            // Enables code shrinking, obfuscation, and optimization for only
            // your project's release build type.
            minifyEnabled = true

            // Enables resource shrinking, which is performed by the
            // Android Gradle plugin.
            shrinkResources = true

            // Includes the default ProGuard rules files that are packaged with
            // the Android Gradle plugin. To learn more, go to the section about
            // R8 configuration files.
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            if (hasReleaseSigning) {
                signingConfig = signingConfigs.release
            }
            multiDexEnabled = true
        }
        debug {
            // 有发布密钥时 debug 也用同一签名：百度地图 AK 绑定签名 SHA1，
            // 统一签名可让一个 AK 同时覆盖 debug 与 release
            if (hasReleaseSigning) {
                signingConfig = signingConfigs.release
            }
            // 否则回退到 AGP 自动生成的 ~/.android/debug.keystore
        }
    }

    // 要存取 secret value 必須要使用到一個 BuildScript 的類別，默认会从 local.properties 中获取
    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packagingOptions {
        jniLibs {
            excludes += ['lib/armeabi/**']
        }
        resources {
            excludes += ['lib/armeabi/**']
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    // 指定输出的可执行程序的名字
    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            def outputFile = output.outputFile
            if (outputFile != null && outputFile.name.endsWith('.apk')) {
                def fileName
                if (variant.buildType.name == 'release') {
                    fileName = "Pathway_${defaultConfig.versionName}_arm64-v8a_release.apk"
                } else {
                    fileName = "Pathway_${defaultConfig.versionName}_arm64-v8a_debug.apk"
                }
                outputFileName=fileName
            }
        }
    }
}

// 缺少发布签名配置时明确失败，避免静默产出未签名的 release 包
tasks.matching { it.name in ['assembleRelease', 'bundleRelease'] }.configureEach {
    doFirst {
        if (!hasReleaseSigning) {
            throw new GradleException(
                    '缺少发布签名配置：请在 local.properties 中填入 RELEASE_STORE_FILE、' +
                            'RELEASE_STORE_PASSWORD、RELEASE_KEY_ALIAS、RELEASE_KEY_PASSWORD 后重试。')
        }
    }
}

dependencies {
    implementation project(':nfc')
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    // AppCompat 1.5.1 开始显式依赖于 Lifecycle 2.5.1 和 SavedState 1.2.0
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.5.1'
    implementation 'androidx.appcompat:appcompat:1.5.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.7.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.elvishew:xlog:1.11.1'
    implementation 'io.noties.markwon:core:4.6.2'
    implementation files('libs/BaiduLBS_Android.jar')
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation('androidx.test.espresso:espresso-core:3.7.0', {
        exclude group: 'com.android.support', module: 'support-annotations'
    })
}
